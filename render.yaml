databases:
  - name: worldcup-db
    plan: free
    databaseName: worldcup
    user: worldcup

services:
  - type: web
    name: worldcup-match-hub-api
    runtime: docker
    plan: free
    rootDir: fifa-worldcup-match-hub/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_HOST
        value: v3.football.api-sports.io
      - key: WC_LEAGUE_ID
        value: "1"
      - key: WC_SEASON
        value: "2026"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: worldcup-db
          property: connectionString
